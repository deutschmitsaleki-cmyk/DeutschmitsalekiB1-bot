name: German B1 Reminder Bot

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  send-b1-topic:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Send B1 daily topic
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          B1_CHAT_ID: ${{ secrets.B1_CHAT_ID }}
        run: python bot_b1.py
